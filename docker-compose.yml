services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: docker
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgres://mathios:${POSTGRES_PASSWORD:-mathios-development-only}@db:5432/mathios
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_IDLE_TIMEOUT_SECONDS: ${DATABASE_IDLE_TIMEOUT_SECONDS:-20}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_ROOT: /app/data/storage
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-26214400}
      STORAGE_SIGNED_URL_TTL_SECONDS: ${STORAGE_SIGNED_URL_TTL_SECONDS:-900}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AUTH_MODE: ${AUTH_MODE:-local-profile}
      HOSTED_AUTH_ISSUER: ${HOSTED_AUTH_ISSUER:-}
      HOSTED_AUTH_AUDIENCE: ${HOSTED_AUTH_AUDIENCE:-}
      HOSTED_AUTH_SHARED_SECRET: ${HOSTED_AUTH_SHARED_SECRET:-}
      HOSTED_AUTH_PUBLIC_KEY: ${HOSTED_AUTH_PUBLIC_KEY:-}
      SEARCH_PROVIDER: local
      AI_PROVIDER: disabled
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-docker-only-change-me}
      SESSION_ROTATION_INTERVAL_SECONDS: ${SESSION_ROTATION_INTERVAL_SECONDS:-86400}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-10}
      CSRF_PROTECTION_ENABLED: ${CSRF_PROTECTION_ENABLED:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ERROR_TRACKING_DSN: ${ERROR_TRACKING_DSN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mathios_storage:/app/data/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mathios
      POSTGRES_USER: mathios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathios-development-only}
    expose:
      - "5432"
    volumes:
      - mathios_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathios -d mathios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mathios_postgres:
  mathios_storage:
